<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Urban mobility analysis workflow</title><desc id="d">MVG bike trips are cleaned, spatially joined with Munich green spaces and districts, analysed with regression, and combined with bicycle accident and overtaking-distance data.</desc><rect width="1200" height="700" fill="#f5f5f5"/><g font-family="Arial,Helvetica,sans-serif" fill="#171717"><text x="70" y="70" font-size="34" font-weight="700">Urban mobility analysis · Munich</text><text x="70" y="105" font-size="18" fill="#666">Three geospatial methods linking bike sharing, green space and cycling safety</text><g transform="translate(70 160)"><rect width="300" height="170" fill="white" stroke="#bbb"/><text x="25" y="40" font-size="20" font-weight="700">01 · MVG bike data</text><text x="25" y="78" font-size="16">2022 trip records</text><text x="25" y="105" font-size="16">start/end coordinates</text><text x="25" y="132" font-size="16">time + duration cleaning</text></g><g transform="translate(450 160)"><rect width="300" height="170" fill="white" stroke="#bbb"/><text x="25" y="40" font-size="20" font-weight="700">02 · Green spaces</text><text x="25" y="78" font-size="16">English Garden</text><text x="25" y="105" font-size="16">Nymphenburg Palace</text><text x="25" y="132" font-size="16">Olympia Park + districts</text></g><g transform="translate(830 160)"><rect width="300" height="170" fill="white" stroke="#bbb"/><text x="25" y="40" font-size="20" font-weight="700">03 · Statistical analysis</text><text x="25" y="78" font-size="16">district-level regressions</text><text x="25" y="105" font-size="16">land value + demographics</text><text x="25" y="132" font-size="16">green-space access</text></g><path d="M370 245h80m300 0h80" stroke="#777" stroke-width="3" marker-end="url(#a)"/><g transform="translate(70 430)"><rect width="300" height="170" fill="white" stroke="#bbb"/><text x="25" y="40" font-size="20" font-weight="700">04 · Safety data</text><text x="25" y="78" font-size="16">German Accident Atlas</text><text x="25" y="105" font-size="16">overtaking-distance GeoJSON</text><text x="25" y="132" font-size="16">50 m nearest spatial join</text></g><g transform="translate(450 430)"><rect width="300" height="170" fill="white" stroke="#bbb"/><text x="25" y="40" font-size="20" font-weight="700">05 · Spatial analysis</text><text x="25" y="78" font-size="16">GeoPandas + Pandas</text><text x="25" y="105" font-size="16">spatial joins + aggregation</text><text x="25" y="132" font-size="16">maps + distributions</text></g><g transform="translate(830 430)"><rect width="300" height="170" fill="white" stroke="#bbb"/><text x="25" y="40" font-size="20" font-weight="700">06 · Findings</text><text x="25" y="78" font-size="16">53,258 trips to/from parks</text><text x="25" y="105" font-size="16">1.30 m mean accident distance</text><text x="25" y="132" font-size="16">urban mobility implications</text></g><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#777"/></marker></defs></g></svg>